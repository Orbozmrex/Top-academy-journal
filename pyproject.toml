[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "top-academy-journal"
version = "0.1.0"
description = "A modern, easy to use, async API wrapper for top academy journal written in Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Aluver" }]
keywords = ["top-academy", "journal", "api", "async", "wrapper"]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
]

[project.urls]
Repository = "https://github.com/Orbozmrex/Top-academy-journal"